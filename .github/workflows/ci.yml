name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Stampede, idempotency, reconciliation, prompt-injection and the rest
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/wallet_test
          TEST_DB_USER: wallet
          TEST_DB_PASSWORD: wallet
        run: ./mvnw -B verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up starts db, api and worker
        run: |
          docker compose up -d --build --wait db api worker
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 2; done
          curl -fs localhost:8080/actuator/health
          docker compose ps
      - name: Logs
        if: always()
        run: docker compose logs --no-color
